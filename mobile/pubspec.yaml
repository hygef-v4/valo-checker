name: valocheck
description: "ValoCheck — unofficial Valorant companion: daily store, night market, career rank, match history, and collection tracker."
publish_to: 'none'

# versionName+versionCode (Android) / CFBundleShortVersionString+CFBundleVersion (iOS).
# Bump the build number (+N) on every store upload.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
